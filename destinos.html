<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExploreNow | Destinos</title>

  <link rel="stylesheet" href="css/destinos.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="logo">
      <img src="img/Captura de tela 2026-02-04 184645.png" alt="ExploreNow Logo" class="logo-img">
    </div>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="destinos.html" class="active">Destinos</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>

    <button class="btn-header" type="button" id="btnPromocoes">Promoções</button>
  </header>

  <section class="hero-destinos">
    <h1>Destinos Inesquecíveis</h1>
    <p>Pacotes exclusivos para você viver experiências únicas</p>
  </section>

  <section class="filtros-destinos" aria-label="Filtros de destinos">
    <div class="filtro-campo">
      <label for="buscaDestino">Buscar destino</label>
      <input type="search" id="buscaDestino" placeholder="Ex: Paris, Rio, Maldivas">
    </div>

    <div class="filtro-campo">
      <label for="filtroCategoria">Tipo de viagem</label>
      <select id="filtroCategoria">
        <option value="todos">Todos</option>
        <option value="romance">Romance</option>
        <option value="cultura">Cultura</option>
        <option value="praia">Praia</option>
        <option value="urbano">Urbano</option>
        <option value="nacional">Nacional</option>
      </select>
    </div>

    <div class="filtro-campo">
      <label for="filtroPreco">Faixa de preço</label>
      <select id="filtroPreco">
        <option value="todos">Todos</option>
        <option value="ate3000">Até R$ 3.000</option>
        <option value="ate7000">Até R$ 7.000</option>
        <option value="acima7000">Acima de R$ 7.000</option>
      </select>
    </div>
  </section>

  <main class="destinos-container" id="destinosContainer" aria-live="polite"></main>

  <p class="estado-vazio" id="estadoVazio" hidden>
    Nenhum pacote encontrado com esses filtros.
  </p>

  <div class="modal-pacote" id="modalPacote" hidden>
    <div class="modal-overlay" data-close-modal></div>
    <article class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
      <button class="modal-close" type="button" aria-label="Fechar detalhes do pacote" data-close-modal>×</button>
      <img id="modalImagem" src="" alt="">
      <div class="modal-info">
        <span class="modal-tag" id="modalCategoria"></span>
        <h2 id="modalTitulo"></h2>
        <p class="modal-preco" id="modalPreco"></p>
        <p id="modalDescricao"></p>
        <ul id="modalItens"></ul>
        <a href="contato.html" class="btn-modal">Quero este pacote</a>
      </div>
    </article>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2026 ExploreNow. Todos os direitos reservados.</p>
      <div class="socials">
        <a href="#">Instagram</a>
        <a href="#">LinkedIn</a>
        <a href="#">Facebook</a>
      </div>
    </div>
  </footer>

  <script src="js/destinos.js"></script>
</body>
</html>
